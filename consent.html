<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consent Notice Listener</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
  label { display: block; margin-top: 12px; font-weight: bold; }
  input { width: 100%; padding: 8px; box-sizing: border-box; }
  .actions { display: flex; gap: 12px; margin: 24px 0; }
  .actions button { flex: 1; padding: 14px; font-size: 16px; border: 2px solid #ccc; background: #f5f5f5; border-radius: 6px; cursor: default; }
  #acceptedBtn.active { background: #2e9e4f; border-color: #2e9e4f; color: #fff; }
  #rejectedBtn.active { background: #d63a3a; border-color: #d63a3a; color: #fff; }
  pre { background: #f0f0f0; padding: 12px; overflow: auto; min-height: 60px; }
</style>
</head>
<body>
  <h2>Consent Notice Result</h2>

  <label for="dataFiduciaryId">data_fiduciary_id</label>
  <input id="dataFiduciaryId" value="f30c280c794e">

  <label for="groupReferenceId">group_reference_id</label>
  <input id="groupReferenceId" value="ANCGR11160">

  <label for="noticeWorkflowId">notice_workflow_id</label>
  <input id="noticeWorkflowId" value="9f4e1a2b-6c334d78-b0e17a2c9d4f5b60">

  <button id="sendBtn" type="button" style="margin-top:16px;padding:10px 16px">Send IDs to app</button>

  <div class="actions">
    <button id="acceptedBtn" type="button">Accepted</button>
    <button id="rejectedBtn" type="button">Rejected</button>
  </div>

  <h3>Last response</h3>
  <pre id="output">Waiting for result from app...</pre>

<script>
  const acceptedBtn = document.getElementById('acceptedBtn');
  const rejectedBtn = document.getElementById('rejectedBtn');
  const output = document.getElementById('output');
  const ids = {
    data_fiduciary_id: document.getElementById('dataFiduciaryId'),
    group_reference_id: document.getElementById('groupReferenceId'),
    notice_workflow_id: document.getElementById('noticeWorkflowId'),
  };

  function showAction(action) {
    acceptedBtn.classList.toggle('active', action === 'accepted');
    rejectedBtn.classList.toggle('active', action === 'rejected');
  }

  // The webview (native) owns the postMessage listener. Hand it the ids the
  // same way sendDeepLink() does in script.js.
  function sendConsentIds() {
    var messageBody = JSON.stringify({
      name: 'consent-notice-result',
      data_fiduciary_id: ids.data_fiduciary_id.value,
      group_reference_id: ids.group_reference_id.value,
      notice_workflow_id: ids.notice_workflow_id.value,
    });
    if (window?.android) {
      Android.passConsentNotice(messageBody);
    } else if (window.webkit?.messageHandlers?.passConsentNotice) {
      window.webkit.messageHandlers.passConsentNotice.postMessage(messageBody);
    } else {
      console.warn('No native bridge found, ids not sent');
    }
  }

  // Native calls this once it receives the consent-notice-result event.
  // Accepts an object or a JSON string.
  function onConsentResult(resultSet) {
    if (typeof resultSet === 'string') resultSet = JSON.parse(resultSet);
    // Accept the full event ({ name, resultSet }) or just the resultSet
    if (resultSet.name === 'consent-notice-result') resultSet = resultSet.resultSet;
    output.textContent = JSON.stringify(resultSet, null, 2);
    showAction(resultSet.data_principal_action);
  }
  window.onConsentResult = onConsentResult;

  document.getElementById('sendBtn').addEventListener('click', sendConsentIds);

  // Buttons only simulate a native callback, for testing in a plain browser
  function simulate(action) {
    onConsentResult({
      status_code: 200,
      message: 'Success',
      status: 'submitted',
      data_fiduciary_id: ids.data_fiduciary_id.value,
      group_reference_id: ids.group_reference_id.value,
      notice_workflow_id: ids.notice_workflow_id.value,
      mandatory_consents_granted: action === 'accepted'
        ? 'all_mandatory_consents_accepted'
        : 'all_mandatory_consents_rejected',
      data_principal_action: action,
      type: 'notice_workflow',
    });
  }
  acceptedBtn.addEventListener('click', () => simulate('accepted'));
  rejectedBtn.addEventListener('click', () => simulate('rejected'));

  sendConsentIds();
</script>
</body>
</html>
